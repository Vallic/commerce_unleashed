commerce_unleashed.settings:
  type: config_object
  label: 'Unleashed settings'
  mapping:
    logging:
      type: boolean
      label: 'Log requests'
    api_id:
      type: string
      label: 'API ID'
    api_key:
      type: string
      label: 'API Key'

commerce_order.commerce_order_type.*.third_party.commerce_unleashed:
  type: mapping
  label: 'Unleashed settings'
  mapping:
    sync:
      type: boolean
      label: 'Enable sync'

commerce_product.commerce_product_type.*.third_party.commerce_unleashed:
  type: mapping
  label: 'Unleashed settings'
  mapping:
    sync:
      type: boolean
      label: 'Enable sync'
    supplier_code:
      type: string
      label: 'Supplier Code'
