commerce_unleashed.settings:
  type: config_object
  label: 'Unleashed settings'
  mapping:
    logging:
      type: boolean
      label: 'Log requests'
    api_id:
      type: string
      label: 'API ID'
    api_key:
      type: string
      label: 'API Key'
    products:
      type: mapping
      mapping:
        sync:
          type: boolean
          label: 'Sync products'
        cron:
          type: boolean
          label: 'Cron sync'
        full:
          type: boolean
          label: 'Full sync'
        type:
          type: string
          label: 'Default variation type'
        product_type:
          type: string
          label: 'Default product type'
        price_sync:
          type: boolean
          label: 'Update variation price from Unleashed'
        price_field:
          type: string
          label: 'Unleashed price field'
        store:
          type: string
          label: 'Default store'
        currency_code:
          type: string
          label: 'Default currency code'
    purchase_orders:
      type: mapping
      mapping:
        sync:
          type: boolean
          label: 'Sync orders'
        types:
          type: sequence
          label: Order types
          mapping:
            type: string
        supplier_code:
          type: string
          label: 'Default supplier code'
        shipping_sku:
          type: string
          label: 'Default shipping SKU'
        complete:
          type: boolean
          label: 'Complete order'
    sales_orders:
      type: mapping
      mapping:
        sync:
          type: boolean
          label: 'Sync orders'
        types:
          type: sequence
          label: Order types
          mapping:
            type: string
        warehouse_code:
          type: string
          label: 'Default warehouse code'
        shipping_sku:
          type: string
          label: 'Default shipping SKU'
        complete:
          type: boolean
          label: 'Complete order'
    stock:
      type: mapping
      mapping:
        sync:
          type: boolean
          label: 'Sync stock'
        availability:
          type: boolean
          label: 'Enforce stock availability'
        local:
          type: boolean
          label: 'Perform local stock updates'
