commerce_unleashed.settings:
  path: '/admin/commerce/config/unleashed'
  defaults:
    _form: 'Drupal\commerce_unleashed\Form\SettingsForm'
    _title: 'Settings'
  requirements:
    _permission: 'access commerce administration pages'
commerce_unleashed.stock_on_hand:
  path: '/admin/commerce/unleashed'
  defaults:
    _controller: '\Drupal\commerce_unleashed\Controller\StockOnHandController::overview'
    _title: 'Stock on hand'
  requirements:
    _permission: 'access commerce administration pages'
